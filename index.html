<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0d1f" />
<meta name="description" content="فال تاروت لومِرا — سفری به درون با کارت‌های تاروت. آفلاین، رایگان و بدون تبلیغ." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="لومِرا" />
<meta property="og:title" content="فال تاروت لومِرا" />
<meta property="og:description" content="آیینه‌ای از درون تو — تاروت." />
<meta property="og:type" content="website" />
<title>فال تاروت لومِرا | Lumera Tarot</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body>

<div class="stars-bg" id="starsBg" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"></div>

<header class="app-header glass">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <defs>
          <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd98a"/>
            <stop offset="100%" stop-color="#b8863b"/>
          </radialGradient>
        </defs>
        <path d="M24 3 L29 19 L45 24 L29 29 L24 45 L19 29 L3 24 L19 19 Z" fill="url(#bg1)"/>
        <circle cx="24" cy="24" r="4" fill="#0a0d1f"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">لومِرا</span>
      <span class="brand-sub">LUMERA · TAROT</span>
    </div>
  </div>

  <div class="header-actions">
    <button id="soundBtn" class="icon-btn" aria-label="صدا" title="صدای امبینت">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M11 5L6 9H3v6h3l5 4V5z"/>
        <path d="M15.5 8.5a5 5 0 010 7"/>
        <path d="M18.5 5.5a9 9 0 010 13"/>
      </svg>
    </button>
    <button id="installBtn" class="install-btn hidden">نصب اپلیکیشن</button>
  </div>
</header>

<main class="app-main">

  <section class="hero">
    <h1 class="hero-title">آیینه‌ای از درون تو</h1>
    <p class="hero-sub">کارت‌ها را بُر بزن، نیت کن و بگذار لومِرا پرده از رازهایت بردارد.</p>
  </section>

  <!-- ===================== TAB: TAROT ===================== -->
  <section id="tarotTab" class="tab-panel">

    <div class="intention glass">
      <label for="intention">نیت خود را در دل یا روی کاغذ بنویس (اختیاری)</label>
      <input id="intention" type="text" maxlength="90" placeholder="مثلاً: درباره‌ی مسیر شغلی‌ام…" />
    </div>

    <h2 class="section-title">چیدمان فال را انتخاب کن</h2>
    <div class="spreads" id="spreadsGrid"></div>

    <section id="board" class="hidden">
      <div class="board-head glass">
        <div>
          <div class="board-title" id="boardTitle">—</div>
          <div class="board-sub" id="boardSub">روی هر کارت بزن تا باز شود</div>
        </div>
        <button class="ghost small" id="resetBtn">فال جدید</button>
      </div>

      <div class="cards-row" id="cardsRow"></div>

      <div class="reading glass hidden" id="reading"></div>

      <div class="cta-row">
        <button class="cta" id="shareBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" style="vertical-align:middle;margin-left:6px">
            <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 002-2v-6"/>
          </svg>
          ساخت کارت استوری
        </button>
      </div>
    </section>
  </section>

  <!-- ===================== TAB: HAFEZ (بزودی) ===================== -->
  <!--
  فال حافظ در نسخه‌ی بعدی لومِرا فعال خواهد شد.
  دلیل تأخیر: نیاز به تعبیر اختصاصی برای هر غزل که با نیت کاربر هم‌خوان باشد.
  -->

  <footer class="app-footer">
    <div>ساخته‌شده با نور ✦ <a href="https://instagram.com/lumera.tv" target="_blank" rel="noopener">@lumera.tv</a></div>
  </footer>
</main>

<canvas id="storyCanvas" width="1080" height="1920" hidden></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/card-art.js"></script>
<script src="js/tarot-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
